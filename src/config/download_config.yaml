MGI_GPI:
  # Resolved at run time from go-site dataset metadata, which owns which upstream
  # is authoritative for this file. Previously pinned to snapshot.geneontology.org
  # -- a GO serving site that this pipeline ultimately feeds (circular), and stale
  # in practice: its GPI was generated 2026-05-20 while MGI's own was 2026-07-27.
  # `url` is only the fallback if go-site metadata cannot be read.
  url: https://www.informatics.jax.org/downloads/reports/mgi.gpi.gz
  go_site_metadata: https://raw.githubusercontent.com/geneontology/go-site/master/metadata/datasets/mgi.yaml
  dataset_id: mgi.gpi
ALLIANCE_ORTHO:
  # The orthology TSV, not the JSON: the TSV layout is stable across Alliance
  # releases; the JSON payloads are not (gopreprocess#78). `url` is only a
  # fallback pin -- normal runs resolve the URL from the manifests below,
  # since the advertised stable URL is not dependable across releases.
  # CAVEAT: the pin is release-versioned; if resolution fails, runs silently
  # use this release's data -- bump the pin each Alliance release
  # (gopreprocess#85).
  url: https://download.alliancegenome.org/9.1.0/downloads/ORTHOLOGY-ALLIANCE_TSV_COMBINED.tsv.gz
  manifests:
    - https://www.alliancegenome.org/api/downloads
    - https://stage.alliancegenome.org/api/downloads
  data_type: ORTHOLOGY-ALLIANCE
  file_extension: tsv.gz
RGD:
  url: http://skyhook.berkeleybop.org/p2go-homology-upstream-file-generator/products/upstream_and_raw_data/rgd-src.gaf.gz
HUMAN:
  url: http://skyhook.berkeleybop.org/p2go-homology-upstream-file-generator/products/upstream_and_raw_data/goa_human-src.gaf.gz
HUMAN_ISO:
  url: http://skyhook.berkeleybop.org/p2go-homology-upstream-file-generator/products/upstream_and_raw_data/goa_human_isoform-src.gaf.gz
MGI_XREF:
  url: https://www.informatics.jax.org/downloads/reports/HOM_MouseHumanSequence.rpt
# drives the curation system - minerva outage causes this and happens weekly - Wednesday every other week
GO:
  url: http://ontology-build.geneontology.org/go.json
