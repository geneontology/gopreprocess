# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.

[tox]
# To use a PEP 517 build-backend you are required to configure tox to use an isolated_build:
# https://tox.readthedocs.io/en/latest/example/package.html
isolated_build = True
skipsdist = True

envlist =
# always keep coverage-clean first
    coverage-clean
    lint-fix
    lint
    codespell-write
    docstr-coverage
    py

[testenv]
allowlist_externals =
    poetry
commands =
    poetry run pytest {posargs}
description = Run unit tests with pytest. This is a special environment that does not get a name, and
              can be referenced with "py".

[testenv:coverage-clean]
deps = coverage
skip_install = true
commands = coverage erase

# This is used during development
[testenv:lint-fix]
deps =
    # Pinned deliberately, and matching the black = "^23.7.0" constraint in
    # pyproject. Unpinned, this env installed whatever black was newest, so CI's
    # formatting opinion changed without any code change -- black >=26 also strips
    # the blank line before class docstrings, which this project keeps (see the
    # D211 entry in the ruff ignore list).
    black~=23.12
    ruff==0.16.0
commands =
    black src/ tests/
    ruff check --fix src/ tests/
description = Run linters and apply fixes (developer-facing).

# This is used for QC checks. Unlike lint-fix, this must not rewrite files:
# in CI the rewrites would land in a throwaway runner and the step would pass
# regardless of whether the code was actually formatted correctly.
[testenv:lint]
deps =
    # Keep in step with lint-fix above.
    black~=23.12
    ruff==0.16.0
commands =
    black --check --diff src/ tests/
    ruff check src/ tests/
description = Check formatting and lint without modifying files.

[testenv:doclint]
deps =
    rstfmt
skip_install = true
commands =
    rstfmt docs/source/
description = Run documentation linters.

[testenv:codespell]
description = Run spell checker.
deps =
    codespell
    tomli  # required for getting config from pyproject.toml
commands = codespell src/ tests/

[testenv:codespell-write]
description = Run spell checker and write corrections.
deps =
    codespell
    tomli
commands = codespell src/ tests/ --write-changes

[testenv:docstr-coverage]
deps =
    docstr-coverage
commands =
    docstr-coverage src/ tests/ --skip-private --skip-magic
description = Run the docstr-coverage tool to check documentation coverage
